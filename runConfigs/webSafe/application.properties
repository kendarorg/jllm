# webSafe: web application for real use. Loopback only, random passwords, a Docker sandbox per role.
server.address=127.0.0.1
# every user without a password gets a random one at start; the administrators' are logged once
jllm.web.use-real-password=true
# the start is refused without the environment variable JLLM_TOKEN_KEY (base64 of 32 bytes: openssl rand -base64 32); set it in the run configuration
# files under webauth/ (no SQL starter needed); with lib-ext/sql: jllm.store=sql
jllm.store=file
