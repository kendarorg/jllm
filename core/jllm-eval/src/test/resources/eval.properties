# jllm-eval settings. Every key can be overridden by -D<key>=... or by the environment variable
# <KEY UPPERCASE, non-alphanumerics as _> (eval.target -> EVAL_TARGET). Command line wins over environment.
# Secrets (*.apiKey) are NEVER read from this file: use the environment or -D.

# ---- run target: anthropic | remote.<name> | local.<strong|alt|small>
eval.target=anthropic

# ---- Anthropic (Claude Haiku 5.5). apiKey: EVAL_ANTHROPIC_APIKEY or ANTHROPIC_API_KEY
eval.anthropic.baseUrl=https://api.anthropic.com
eval.anthropic.model=claude-haiku-5-5
eval.anthropic.contextTokens=200000
eval.anthropic.timeoutSeconds=300

# ---- named remote OpenAI-compatible entries (managed by hand, never started/stopped by the eval)
eval.remote.mac.protocol=openai
eval.remote.mac.baseUrl=http://localhost:8080/v1
eval.remote.mac.model=qwen3.6-27b
eval.remote.mac.contextTokens=65536
eval.remote.mac.smallModel=false
eval.remote.mac.timeoutSeconds=1800
# eval.remote.mac.apiKey  -> environment only

# ---- judge: anthropic (default) | openai
eval.judge=anthropic
eval.judge.anthropic.model=claude-haiku-5-5
# openai-compatible judge, used when eval.judge=openai (separate from any target entry)
eval.judge.openai.baseUrl=http://localhost:8081/v1
eval.judge.openai.model=judge-model
eval.judge.openai.contextTokens=65536
eval.judge.openai.timeoutSeconds=1800

# ---- fast model: target (default) | anthropic | remote.<name>
eval.fast=target
eval.fast.anthropic.model=claude-haiku-5-5

# ---- local llama.cpp server: run by hand with docker compose (see docker/), never started by the eval.
# These values must match the compose env file of the model (docker/<k>.env); the connection check verifies the alias.
eval.local.port=8080
# file = GGUF file name inside modelsDir. alias = the model name the server exposes (no quantization).
# contextTokens is passed to the server (-c) and to the harness: lower it to force e.g. 64k in tests.
eval.local.model.strong.file=Qwen3.6-27B-Q4_K_M.gguf
eval.local.model.strong.alias=qwen3.6-27b
eval.local.model.strong.contextTokens=65536
eval.local.model.strong.smallModel=false
eval.local.model.strong.extraArgs=
eval.local.model.alt.file=gpt-oss-20b-mxfp4.gguf
eval.local.model.alt.alias=gpt-oss-20b
eval.local.model.alt.contextTokens=65536
eval.local.model.alt.smallModel=false
eval.local.model.alt.extraArgs=
eval.local.model.small.file=small-model-Q4_K_M.gguf
eval.local.model.small.alias=small-model
eval.local.model.small.contextTokens=32768
eval.local.model.small.smallModel=true
eval.local.model.small.extraArgs=

# ---- timeouts (seconds) and trials
eval.timeout.connect=10
eval.timeout.warmup=1800
eval.trials=3
eval.outputDir=target/eval-output
