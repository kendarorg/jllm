[project]
name = "jllm-eval-common"
version = "0.1.0"
description = "Shared helpers for the jllm benchmark runners: CLI result, limits and budget, run parameters, summaries."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jllm_eval_common"]

[tool.hatch.build.targets.wheel.force-include]
"install.sh" = "jllm_eval_common/install.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
