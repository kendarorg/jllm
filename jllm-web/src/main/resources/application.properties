server.port=8080
spring.application.name=jllm-web
spring.mvc.async.request-timeout=-1
# static UI files: always revalidate, so a rebuilt UI is never served stale from the browser cache
spring.web.resources.cache.cachecontrol.no-cache=true

# provider: anthropic | openai | qwen | llamacpp | ollama   (key from jllm.api-key or <PROVIDER>_API_KEY)
jllm.provider=anthropic
#jllm.api-key=
#jllm.model=
#jllm.base-url=
jllm.max-tokens=32000
#jllm.context-tokens=100000
#jllm.workdir=.
#jllm.settings=harness.json
#jllm.context-strategy=compaction
#jllm.small-model=false
#jllm.pricing.input-per-million=3
#jllm.pricing.output-per-million=15
#jllm.pricing.cache-read-per-million=0.3
#jllm.pricing.cache-write-per-million=3.75

server.error.include-message=always
# uploads above the threshold go to a temporary file, not the heap; the limits can be set per installation
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-file-size=${JLLM_UPLOAD_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${JLLM_UPLOAD_MAX_REQUEST_SIZE:200MB}
