# Web app properties, read at every start from this folder. Command line arguments (--jllm.model=...) win.
# Uncomment and set a provider and a model. Keep the key in an environment variable, not in this file.

# provider: anthropic | openai | gemini | grok | qwen | ollama | llamacpp
#jllm.provider=anthropic
#jllm.model=
#jllm.api-key=${ANTHROPIC_API_KEY}
# only for a local or self-hosted server:
#jllm.base-url=http://localhost:11434/v1

# tokens: the model's context window and the output limit of one answer
#jllm.context-tokens=100000
#jllm.max-tokens=32000

# cost estimate, USD per million tokens
#jllm.pricing.input-per-million=3
#jllm.pricing.output-per-million=15
