# Web app properties, read at every start from this folder. Command line arguments (--jllm.model=...) win.
# Uncomment and set a provider and a model. Keep the key in an environment variable, not in this file.

# Local only by default. To expose the app: server.address=0.0.0.0, jllm.web.use-real-password=true and a TLS proxy.
server.address=127.0.0.1
#jllm.web.use-real-password=true

# provider: anthropic | openai | gemini | grok | qwen | ollama | llamacpp
#jllm.provider=anthropic
#jllm.model=
#jllm.api-key=${ANTHROPIC_API_KEY}
# only for a local or self-hosted server:
#jllm.base-url=http://localhost:11434/v1

# tokens: the model's context window and the output limit of one answer
#jllm.context-tokens=100000
#jllm.max-tokens=32000

# cost estimate, USD per million tokens
#jllm.pricing.input-per-million=3
#jllm.pricing.output-per-million=15

# store: with lib-ext/sql (shipped) the data (users, roles, chats, tokens, settings) lives in SQL, SQLite by default in
# <jllm.webauth-dir>/jllm.db (data/jllm.db without that setting). jllm.store=file keeps the files under webauth/ instead.
# The database is chosen by the JDBC url alone: jdbc:sqlite:..., jdbc:mysql:... or jdbc:postgresql:... (MySQL and PostgreSQL are experimental).
#jllm.store=sql
#jllm.sql.url=jdbc:mysql://localhost:3306/jllm?useUnicode=true&characterEncoding=utf8
#jllm.sql.url=jdbc:postgresql://localhost:5432/jllm
#jllm.sql.user=jllm
#jllm.sql.password=${JLLM_SQL_PASSWORD}
#jllm.sql.pool=10
# a new database gets the users admin, poweru, guest (password = user name; use-real-password=true randomizes them)
#jllm.sql.seed=true
# MySQL (GPL) and PostgreSQL drivers are not shipped: run fetch-sql-driver.sh | .cmd | .ps1 <mysql|postgres> once; the jar lands
# in lib-ext/ (release zip) or .downloaded-libs (source checkout); jllm.sql.driver-dir overrides. SQLite is bundled.
# Stored tokens are encrypted when the environment variable JLLM_TOKEN_KEY (base64, 32 bytes) is set, else kept in clear.
